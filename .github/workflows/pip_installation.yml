# Perform pip installation and run all tests

# For feature branches, we don't test the full matrix (os x [stable, loose]) in order to save time & resources.
# On each push to develop, the whole test matrix runs, additionally, its success is mandatory for merging to main.
# In the (assumed to be rare case) that these full matrix tests fail but the reduced matrix tests passed,
# we will learn about it latest before pushing to main. The merge that caused the issue can then be identified
# from the tests that ran on develop.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

name: Pip installation and tests

jobs:
  stable_installation:
    name: Test stable pip installation (mono) on ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: [3.9]
    uses: ./.github/workflows/_run_tests.yml
    with:
      os: ${{ matrix.os }}
      python-version: ${{ matrix.python-version }}
      install-script: pip_install.sh stable,owl-stable,tests
      dotnet-runtime: mono

  loose_installation:
    name: Test loose pip installation (mono) on ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: [3.9]
    uses: ./.github/workflows/_run_tests.yml
    with:
      os: ${{ matrix.os }}
      python-version: ${{ matrix.python-version }}
      install-script: pip_install.sh loose,owl,tests
      dotnet-runtime: mono

  stable_installation_coreclr:
    name: Test stable pip installation (coreclr) on ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: [3.9]
    uses: ./.github/workflows/_run_tests.yml
    with:
      os: ${{ matrix.os }}
      python-version: ${{ matrix.python-version }}
      install-script: pip_install.sh stable,owl-stable,tests
      dotnet-runtime: coreclr

  loose_installation_coreclr:
    name: Test loose pip installation (coreclr) on ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: [3.9]
    uses: ./.github/workflows/_run_tests.yml
    with:
      os: ${{ matrix.os }}
      python-version: ${{ matrix.python-version }}
      install-script: pip_install.sh loose,owl,tests
      dotnet-runtime: coreclr
