# reusable workflow to run all tests
name: run-tests

on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string
      python-version:
        required: true
        type: string
      install-script:
        required: true
        type: string
      dotnet-runtime:
        required: false
        type: string
        default: mono
jobs:
  run-tests:
    runs-on: ${{ inputs.os }}
    steps:
    - uses: actions/checkout@v3
    - uses: conda-incubator/setup-miniconda@v3
      with:
        miniconda-version: "latest"
        auto-update-conda: true
        python-version: ${{ inputs.python-version }}
    # pythonnet's runtime is process-global, so the whole suite (Thermo + Sciex)
    # runs under one backend. Windows uses its built-in .NET Framework ("netfx");
    # other platforms use the requested runtime (mono by default) so the .NET
    # Framework DLLs of both readers load. The runtime package itself is installed
    # into the conda env by pip_install.sh.
    - name: Configure .NET runtime
      shell: bash -l {0}
      run: |
        if [ "$RUNNER_OS" = "Windows" ]; then
          echo "ALPHARAW_DOTNET_RUNTIME=netfx" >> "$GITHUB_ENV"
        else
          echo "ALPHARAW_DOTNET_RUNTIME=${{ inputs.dotnet-runtime }}" >> "$GITHUB_ENV"
        fi
    - name: Conda info
      shell: bash -l {0}
      run: conda info
    - name: Perform pip installation
      shell: bash -l {0}
      run: |
        cd misc
        . ./${{ inputs.install-script }} alpharaw ${{ inputs.python-version }} "$ALPHARAW_DOTNET_RUNTIME"
    - name: Run tests
      shell: bash -l {0}
      run: |
        conda activate alpharaw
        cd tests
        python download_test_data.py
        . ./run_tests.sh
        conda deactivate
