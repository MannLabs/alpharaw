# Verifies that Thermo .raw files can be read using only the cross-platform .NET
# runtime (pythonnet's coreclr backend) with the bundled .NET 8 RawFileReader DLLs
# and NO Mono installed. This is the only job exercising ALPHARAW_DOTNET_RUNTIME=
# coreclr; because that runtime cannot load the Sciex .NET Framework DLLs, it covers
# the Thermo reader only. Sciex stays covered by pip_installation.yml (Mono).
name: Mono-free Thermo tests

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

# URL of the shared Thermo test file (mirrors tests/download_test_data.py).
env:
  IRT_RAW_URL: https://datashare.biochem.mpg.de/public.php/dav/files/0lJqqAQQcTd9QNB/iRT.raw

jobs:
  thermo-coreclr:
    name: Thermo read via coreclr on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is arm64 — now testable because coreclr needs no Mono.
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.9']
    runs-on: ${{ matrix.os }}
    env:
      ALPHARAW_DOTNET_RUNTIME: coreclr
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install .NET 8 runtime (no Mono)
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
    - name: Install alpharaw
      run: |
        python -m pip install --upgrade pip
        pip install pythonnet==3.0.3
        pip install .
    - name: Download Thermo test file
      run: |
        python -c "from alphabase.tools.data_downloader import DataShareDownloader; DataShareDownloader('${{ env.IRT_RAW_URL }}', 'nbs_tests/test_data').download()"
    - name: Read a .raw file via coreclr
      run: python docker/test_thermo_mono_free.py nbs_tests/test_data/iRT.raw
